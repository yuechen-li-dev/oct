function WasmCompute.SumTo entry=entry

block entry
  successors: b1
  predecessors: -
  reachable: true

block b1
  successors: b2, b3
  predecessors: entry, b2
  reachable: true

block b2
  successors: b1
  predecessors: b1
  reachable: true

block b3
  successors: -
  predecessors: b1
  reachable: true
